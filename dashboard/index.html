<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BooxDrop · TabX</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">B</div>
      <div class="brand-txt"><b>BooxDrop</b><span id="brandModel">TabX</span></div>
    </div>

    <nav class="nav">
      <div class="nav-label">Browse</div>
      <button data-view="overview" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Overview
      </button>
      <button data-view="files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17z"/></svg>
        Files
      </button>
      <button data-view="library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4.5h5.5A2.5 2.5 0 0 1 12 7v13a2 2 0 0 0-2-2H4z"/><path d="M20 4.5h-5.5A2.5 2.5 0 0 0 12 7v13a2 2 0 0 1 2-2h6z"/></svg>
        Library <span class="badge" id="libBadge">–</span>
      </button>
      <button data-view="media">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 16l-5-5-4.5 4.5L9 13l-6 6"/></svg>
        Media
      </button>
      <button data-view="transfer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
        Transfer
      </button>
    </nav>

    <div class="side-foot">
      <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">Not connected</span></div>
      <button id="btnClearCache" class="cache-btn" title="Clear cached library and file lists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6 7l1 13h10l1-13"/></svg>
        <span>Clear cache</span>
      </button>
    </div>
  </aside>

  <main>
    <header class="top">
      <div>
        <h1 id="pageTitle">Overview</h1>
        <div class="sub">Local transfer over your network — no cloud</div>
      </div>
      <div class="top-right">
        <label class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18"/></svg>
          <input id="base" placeholder="192.0.2.10:8085" spellcheck="false">
        </label>
        <button class="btn primary" id="btnConnect">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg>
          Connect
        </button>
      </div>
    </header>

    <!-- OVERVIEW -->
    <section class="view on" id="v-overview">
      <div class="grid cards" style="margin-bottom:22px">
        <div class="card">
          <div class="k">Storage used</div>
          <div class="v" id="ovUsed">–</div>
          <div class="bar"><i id="ovBar" style="width:0%"></i></div>
          <div class="m" id="ovFree">–</div>
        </div>
        <div class="card">
          <div class="k">Library</div>
          <div class="v" id="ovBooks">–</div>
          <div class="m" id="ovShelves">–</div>
        </div>
        <div class="card">
          <div class="k">Files at root</div>
          <div class="v" id="ovFiles">–</div>
          <div class="m" id="ovFilesMeta">–</div>
        </div>
        <div class="card">
          <div class="k">Media</div>
          <div class="v" id="ovMedia">–</div>
          <div class="m" id="ovMediaMeta">–</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h">
          <h2>Recently updated</h2>
          <div class="right"><button class="btn ghost" id="ovRefresh" style="font-size:12px">Refresh</button></div>
        </div>
        <div id="ovRecent">
          <div class="skel"></div><div class="skel"></div><div class="skel"></div>
        </div>
      </div>
    </section>

    <!-- FILES -->
    <section class="view" id="v-files">
      <div class="panel">
        <div class="toolbar">
          <div class="crumbs" id="crumbs"></div>
          <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <label class="field" style="padding:5px 9px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="fileSearch" placeholder="Filter" style="width:110px" spellcheck="false">
            </label>
            <button class="btn ghost" id="btnNewFolder" title="New folder" style="padding:6px 9px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17z"/><path d="M12 12v5M9.5 14.5h5"/></svg>
            </button>
            <button class="btn ghost" id="btnRefreshFiles" title="Refresh" style="padding:6px 9px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.5 6"/><path d="M20 5v6h-6"/></svg>
            </button>
          </div>
        </div>
        <div id="filesBox">
          <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
        </div>
      </div>
    </section>

    <!-- LIBRARY -->
    <section class="view" id="v-library">
      <div class="panel">
        <div class="chips" id="shelves"></div>
        <div class="books" id="books">
          <div class="skel"></div><div class="skel"></div>
        </div>
      </div>
    </section>

    <!-- MEDIA -->
    <section class="view" id="v-media">
      <div class="panel">
        <div class="chips" id="mediaChips"></div>
        <div id="mediaBox">
          <div class="skel"></div><div class="skel"></div>
        </div>
      </div>
    </section>

    <!-- TRANSFER -->
    <section class="view" id="v-transfer">
      <div class="panel">
        <div class="panel-h">
          <h2>Send a file to the device</h2>
          <div class="right"><span style="font-size:12px;color:var(--dim)" id="upDest">/storage/emulated/0</span></div>
        </div>
        <div id="dropzone" class="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
          <b>Drop files here</b>
          <span>or pick them from your computer</span>
          <div><button class="btn primary" id="btnBrowse">Choose files</button></div>
        </div>
        <input type="file" id="upFilename" multiple hidden>
        <div class="ups" id="ups"></div>
      </div>
    </section>
  </main>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
<script src="reader.js"></script>
</body>
</html>
